<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img"><title>paperclaw. An always-on agent that checks 571 registered solar parks in Berlin/Brandenburg against the official registry and Sentinel-2 satellite images, and flags megawatts that exist only on paper. Built for the NVIDIA Berlin Claw Agent Challenge.</title><rect width="400" height="210" rx="22" fill="#161b22"/><circle cx="36" cy="40" r="7" fill="#3ddc97"/><text x="364" y="46" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="end">2026</text><text x="28" y="118" fill="#3ddc97" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start">571</text><text x="28" y="158" fill="#e6edf3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">paperclaw</text><text x="28" y="186" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">parks checked against Sentinel-2</text></svg>
